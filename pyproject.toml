[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-platform-v2"
version = "0.0.0"
description = "AI video generation & publishing platform (v2 foundation)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "minio>=7.2",
  "temporalio>=1.7",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  # storyboard 生成出力を固定 schema で検証する（ADR-0016）
  "jsonschema>=4.23",
  # 生成メディアのデコード検査と 9:16 正規化（ADR-0017）。infrastructure/media だけが使う
  "pillow>=11.0",
  "av>=14.0",
  # 有料メディア provider（fal queue）の HTTP クライアント（ADR-0017）。infrastructure/providers だけが使う
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.setuptools.packages.find]
include = ["apps*", "workers*", "domain*", "infrastructure*", "contracts*", "prompts*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires docker compose services",
  "live: calls the real Codex CLI (opt-in via AVP_LIVE_CODEX=1)",
]
# 既定の実行では live テストを収集しない（tests/live/conftest.py と二重の防御）
addopts = "-m 'not live'"

[tool.pyright]
include = ["apps", "workers", "domain", "infrastructure", "contracts", "tests"]
# CI・ローカルとも .venv を作って使う（.github/workflows/ci.yml の types ジョブと同じ）
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
