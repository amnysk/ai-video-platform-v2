# ローカル開発環境（ADR-0005）。本番構成ではない。
# 起動:      docker compose --profile core up -d
# 監視つき:  docker compose --profile core --profile observability up -d
name: avp2

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-avp}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-avp}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me}
  MINIO_BUCKET: ${MINIO_BUCKET:-artifacts}
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: episode-skeleton

services:
  postgres:
    image: postgres:17-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-avp}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      # 実データはHDDの実パスへ。シンボリックリンクを挟まない。
      #
      # !! 警告 !! このパスは fuseblk（非POSIX）でマウントされており、
      # MinIO は書き込み成功後に読み戻せない状態になる。
      # 詳細と選択肢: docs/operations/storage-backend.md
      # 変更は所有者の判断（Phase 1 固定の前提条件）。
      - /mnt/minio-hdd/minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:latest
    profiles: [core]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-avp}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:latest
    profiles: [core]
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports: ["8233:8080"]

  migrate:
    build: .
    profiles: [core]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    profiles: [core]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_started}
      minio: {condition: service_started}
    environment:
      <<: *app-env
    ports: ["8000:8000"]
    command:
      ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dummy-worker:
    build: .
    profiles: [core]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_started}
      minio: {condition: service_started}
    environment:
      <<: *app-env
    command: ["python", "-m", "workers.dummy.run_worker"]
    # Workerは水平に増やせる。互いを直接呼ばない（INV-3）。
    deploy:
      replicas: 1

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    depends_on: [prometheus]
    ports: ["3001:3000"]
    volumes: [grafanadata:/var/lib/grafana]

volumes:
  pgdata:
  grafanadata:
