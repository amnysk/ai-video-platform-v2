# ローカル開発環境（ADR-0005）。本番構成ではない。
# 起動:      docker compose --profile core up -d   （常駐 Worker も含む。ADR-0024 / docs/operations/workers.md）
# 監視つき:  docker compose --profile core --profile observability up -d
name: avp2

# DB と Temporal だけ（MinIO を使わない pipeline-worker 用）
x-core-env: &core-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-avp}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-avp}
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  # ADR-0040: 構造化ログ（service_name は各サービスの AVP_SERVICE_NAME）。text は rollback 用
  # 既定値を持たない（未設定は整形器が unknown にする）。本番の .env には AVP_ENVIRONMENT=prod（I-5）
  AVP_ENVIRONMENT: ${AVP_ENVIRONMENT:-}
  AVP_LOG_FORMAT: ${AVP_LOG_FORMAT:-json}

x-app-env: &app-env
  <<: *core-env
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me}
  MINIO_BUCKET: ${MINIO_BUCKET:-artifacts}
  TEMPORAL_TASK_QUEUE: episode-skeleton

# ADR-0040 §1: json-file のローテーションと、各行の attrs（Collector が compose project・サービス・
# avp.logging の label で振り分ける）。既定の blocking モードのまま（non-blocking は黙って欠損する）。
# 変更の反映にはコンテナの再作成が要る（次の deploy-workers）。
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    labels: "com.docker.compose.service,com.docker.compose.project,avp.logging"
    tag: "{{.Name}}"

# アプリ（app / worker イメージ）の行を Collector が JSON として扱う印（contracts/log_contract.APP_LOG_LABEL）
x-app-labels: &app-labels
  avp.logging: app

# 常駐 Worker の共通部（ADR-0024）。起動する worker は command、見張る queue は healthcheck で決める。
# worker_entry は起動直後の設定不足などで落ちたとき backoff してから終了するので、
# restart: unless-stopped でも高速な再起動ループにならない。
x-worker: &worker
  build: {context: ., target: worker}
  image: avp2-worker:local
  profiles: [core]
  user: "${AVP_UID:-1000}:${AVP_GID:-1000}"
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  # 権限を持たせない（rootless の AVP_UID=0 でも host 上は非特権。rootful 誤用の被害も狭める）
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  labels: *app-labels

x-worker-health: &worker-health
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 60s

x-deps-minio: &deps-minio
  postgres: {condition: service_healthy}
  migrate: {condition: service_completed_successfully}
  temporal: {condition: service_healthy}
  minio: {condition: service_healthy}

# 一時作業領域。host と同じパスに見せる（DB に残るパスと食い違わせない）。
# 補間の既定値に `:` を含むので volume は long syntax で書く。
x-work-root: &work-root
  type: bind
  source: ${AI_VIDEO_WORK_ROOT:-/mnt/minio-hdd/ai-video-work}
  target: ${AI_VIDEO_WORK_ROOT:-/mnt/minio-hdd/ai-video-work}

services:
  postgres:
    logging: *logging
    restart: unless-stopped
    image: postgres:17-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-avp}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # integration テスト用の avp_test を初回起動時に作る（ADR-0021）
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    logging: *logging
    restart: unless-stopped
    image: minio/minio:latest
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      # 実データはHDDの実パスへ。シンボリックリンクを挟まない。
      # このパスは ext4（POSIX）でマウントされていること。
      # MinIO は非POSIXファイルシステム（NTFS/exFAT等のFUSEマウント）では
      # 書き込み成功後に読み戻せなくなる。経緯と検証:
      # docs/operations/storage-backend.md
      - /mnt/minio-hdd/minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    logging: *logging
    image: temporalio/auto-setup:latest
    profiles: [core]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-avp}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -qx SERVING"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-ui:
    logging: *logging
    restart: unless-stopped
    image: temporalio/ui:latest
    profiles: [core]
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports: ["8233:8080"]

  migrate:
    logging: *logging
    labels: *app-labels
    # Dockerfile の最終 stage は worker。api / migrate / dummy-worker は app を明示する（revision label つき）
    build: {context: ., target: app}
    image: avp2-app:local
    profiles: [core]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AVP_SERVICE_NAME: migrate
      <<: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    logging: *logging
    labels: *app-labels
    # Dockerfile の最終 stage は worker。api / migrate / dummy-worker は app を明示する（revision label つき）
    build: {context: ., target: app}
    image: avp2-app:local
    profiles: [core]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_started}
      minio: {condition: service_started}
    environment:
      AVP_SERVICE_NAME: api
      <<: *app-env
      # ADR-0037 §8.5: Research の受け付けの門（予算・Provider）。research-worker と同じ値を読む
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-none}
    ports: ["8000:8000"]
    restart: unless-stopped
    # ADR-0040 §1: uvicorn.run(log_config=None, access_log=False) + 共通のログ設定。access log は
    # api.request.completed で置き換える
    command: ["python", "-m", "apps.api.serve"]

  dummy-worker:
    logging: *logging
    labels: *app-labels
    # 骨組み worker は既存の app（base + revision label）イメージのまま（worker イメージの依存を要しない）
    # Dockerfile の最終 stage は worker。api / migrate / dummy-worker は app を明示する（revision label つき）
    build: {context: ., target: app}
    image: avp2-app:local
    profiles: [core]
    init: true
    restart: unless-stopped
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: dummy-worker
      <<: *app-env
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.dummy.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "episode-skeleton"]
    # Workerは水平に増やせる。互いを直接呼ばない（INV-3）。
    deploy:
      replicas: 1

  script-worker:
    <<: *worker
    # Codex の Linux sandbox（bubblewrap）は user namespace を作る。Docker 既定の seccomp はそれを拒むので
    # Codex を使う2つだけ seccomp を外す（sandbox 自体は read-only を強制する。ADR-0024）
    # uid 0 の map に CAP_SETFCAP が要る（実測。他の cap は不要）
    cap_add: [SETFCAP]
    security_opt: ["no-new-privileges:true", "seccomp=unconfined"]
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: script-worker
      <<: *app-env
      HOME: /home/avp
      CODEX_BINARY: /usr/local/bin/codex
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-900}
      # Topic Planner の live Analytics（ADR-0025）。既定は無効。upload-worker と同じ OAuth client・token
      YOUTUBE_ANALYTICS_ENABLED: ${YOUTUBE_ANALYTICS_ENABLED:-false}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      # refresh token は値を env に置かず、ro mount したファイルのパスだけを渡す（repo 外・0600）
      YOUTUBE_REFRESH_TOKEN_PATH: /run/avp/youtube/${YOUTUBE_REFRESH_TOKEN_FILE:-youtube-refresh-token}
      # Research への opt-in 接続（ADR-0039 §B6 / ADR-0038 §B6）。既定 OFF（接続前と同じ動き）
      PLANNER_TREND_ENABLED: ${PLANNER_TREND_ENABLED:-false}
      SCRIPT_EVIDENCE_ENABLED: ${SCRIPT_EVIDENCE_ENABLED:-false}
      # Evidence の依頼の門（予算・Provider）。api・research-worker と同じ値を読む（ADR-0037 §8.5）
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-none}
    volumes:
      # Codex の認証・設定。token 更新を書き戻すので rw（中身はイメージに焼かない）
      - type: bind
        source: ${CODEX_HOME_HOST_DIR:-${HOME}/.codex}
        target: /home/avp/.codex
      - type: bind
        source: ${YOUTUBE_TOKEN_HOST_DIR:-${HOME}/.config/avp}
        target: /run/avp/youtube
        read_only: true
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.planning.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "script"]

  storyboard-worker:
    <<: *worker
    # Codex の Linux sandbox（bubblewrap）は user namespace を作る。Docker 既定の seccomp はそれを拒むので
    # Codex を使う2つだけ seccomp を外す（sandbox 自体は read-only を強制する。ADR-0024）
    # uid 0 の map に CAP_SETFCAP が要る（実測。他の cap は不要）
    cap_add: [SETFCAP]
    security_opt: ["no-new-privileges:true", "seccomp=unconfined"]
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: storyboard-worker
      <<: *app-env
      HOME: /home/avp
      CODEX_BINARY: /usr/local/bin/codex
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-900}
      AI_VIDEO_WORK_ROOT: ${AI_VIDEO_WORK_ROOT:-/mnt/minio-hdd/ai-video-work}
      # コンテナ内の固定パス。host 側は OPENMONTAGE_HOST_PATH
      OPENMONTAGE_REPO_PATH: /opt/openmontage
      OPENMONTAGE_COMMIT: ${OPENMONTAGE_COMMIT:-2fa571e39ad0632148dad77c7a2134f7e6fe0797}
      STORYBOARD_TIMEOUT_SECONDS: ${STORYBOARD_TIMEOUT_SECONDS:-900}
    volumes:
      - type: bind
        source: ${CODEX_HOME_HOST_DIR:-${HOME}/.codex}
        target: /home/avp/.codex
      - type: bind
        source: ${OPENMONTAGE_HOST_PATH:-${HOME}/projects/ai-video-platform-v2/ai-toolbox/repos/OpenMontage}
        target: /opt/openmontage
        read_only: true
      - *work-root
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.storyboard.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "storyboard"]

  production-worker:
    <<: *worker
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: production-worker
      <<: *app-env
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.production.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "production"]

  production-image-worker:
    <<: *worker
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: production-image-worker
      <<: *app-env
      FAL_KEY: ${FAL_KEY:-}
      AI_VIDEO_WORK_ROOT: ${AI_VIDEO_WORK_ROOT:-/mnt/minio-hdd/ai-video-work}
      IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-2}
    volumes:
      - *work-root
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.production_image.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "production-image", "--max-age-seconds", "2700"]

  production-voice-worker:
    <<: *worker
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: production-voice-worker
      <<: *app-env
      AI_VIDEO_WORK_ROOT: ${AI_VIDEO_WORK_ROOT:-/mnt/minio-hdd/ai-video-work}
      PIPER_PYTHON: /opt/piper/venv/bin/python
      # コンテナ内の固定パス。host 側の置き場は PIPER_VOICES_HOST_DIR
      PIPER_VOICE_PATH: /opt/piper/voices/${PIPER_VOICE_FILE:-en_US-kristin-medium.onnx}
      VOICE_CONCURRENCY: ${VOICE_CONCURRENCY:-1}
    volumes:
      - type: bind
        source: ${PIPER_VOICES_HOST_DIR:-${HOME}/.local/share/avp2/piper/voices}
        target: /opt/piper/voices
        read_only: true
      - *work-root
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.production_voice.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "production-voice", "--max-age-seconds", "900"]

  production-video-worker:
    <<: *worker
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: production-video-worker
      <<: *app-env
      FAL_KEY: ${FAL_KEY:-}
      AI_VIDEO_WORK_ROOT: ${AI_VIDEO_WORK_ROOT:-/mnt/minio-hdd/ai-video-work}
      VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-1}
    volumes:
      - *work-root
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.production_video.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "production-video", "--max-age-seconds", "2700"]

  scene-alternative-worker:
    # ADR-0035: provider に拒否されたシーンの代替映像案を Codex で計画する（有料の画像・動画は呼ばない）。
    # Codex の sandbox のため storyboard-worker と同じ seccomp / cap の例外を持つ（ADR-0024）
    <<: *worker
    cap_add: [SETFCAP]
    security_opt: ["no-new-privileges:true", "seccomp=unconfined"]
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: scene-alternative-worker
      <<: *app-env
      HOME: /home/avp
      CODEX_BINARY: /usr/local/bin/codex
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-900}
    volumes:
      - type: bind
        source: ${CODEX_HOME_HOST_DIR:-${HOME}/.codex}
        target: /home/avp/.codex
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.production.scene_alternative.run_worker"]
    healthcheck:
      <<: *worker-health
      # Activity 専用 queue。計画 Activity（start_to_close 20 分）の実行中は poll しないので長めに見る
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "production-scene-alternative", "--max-age-seconds", "1500"]

  render-worker:
    <<: *worker
    # 描画中の Activity を heartbeat 付きで区切りよく止める猶予
    stop_grace_period: 120s
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: render-worker
      <<: *app-env
      AI_VIDEO_WORK_ROOT: ${AI_VIDEO_WORK_ROOT:-/mnt/minio-hdd/ai-video-work}
      # コンテナ内の固定パス。host 側は AVP_FFMPEG_DIR / RENDER_FONT_HOST_PATH
      RENDER_FFMPEG_PATH: /opt/avp/ffmpeg/ffmpeg
      RENDER_FFMPEG_SHA256: ${RENDER_FFMPEG_SHA256:-810f94020e76e2b58fb44759a322e86bea5d213ebededad7471f3a15b0bf2c5c}
      RENDER_FFPROBE_PATH: /opt/avp/ffmpeg/ffprobe
      RENDER_FFPROBE_SHA256: ${RENDER_FFPROBE_SHA256:-4818b8964b5d7b699370628a4154c97e88205678ee506ca72e9330600e917667}
      RENDER_FONT_PATH: /opt/avp/fonts/NotoSansCJK-Regular.ttc
      RENDER_FONT_SHA256: ${RENDER_FONT_SHA256:-b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a}
      RENDER_FFMPEG_THREADS: ${RENDER_FFMPEG_THREADS:-4}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
    volumes:
      - type: bind
        source: ${AVP_FFMPEG_DIR:-${HOME}/.local/share/avp/ffmpeg/7.1.1}
        target: /opt/avp/ffmpeg
        read_only: true
      - type: bind
        source: ${RENDER_FONT_HOST_PATH:-/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc}
        target: /opt/avp/fonts/NotoSansCJK-Regular.ttc
        read_only: true
      - *work-root
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.render.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "render"]

  upload-worker:
    <<: *worker
    # resumable upload の chunk 送信を区切りよく止める猶予
    stop_grace_period: 120s
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: upload-worker
      <<: *app-env
      AI_VIDEO_WORK_ROOT: ${AI_VIDEO_WORK_ROOT:-/mnt/minio-hdd/ai-video-work}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      # refresh token は値を env に置かず、ro mount したファイルのパスだけを渡す（repo 外・0600）
      YOUTUBE_REFRESH_TOKEN_PATH: /run/avp/youtube/${YOUTUBE_REFRESH_TOKEN_FILE:-youtube-refresh-token}
      UPLOADS_PAUSED: ${UPLOADS_PAUSED:-false}
    volumes:
      # host 側のディレクトリは事前に所有者が作る（make worker-dirs）。無いと Docker が root 所有で作ってしまう
      - type: bind
        source: ${YOUTUBE_TOKEN_HOST_DIR:-${HOME}/.config/avp}
        target: /run/avp/youtube
        read_only: true
      - *work-root
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.upload.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "upload"]

  pipeline-worker:
    <<: *worker
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
    environment:
      AVP_SERVICE_NAME: pipeline-worker
      <<: *core-env
      PAUSED: ${PAUSED:-false}
      UPLOADS_PAUSED: ${UPLOADS_PAUSED:-false}
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.pipeline.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "pipeline"]

  research-worker:
    # ADR-0037 §8.5: Research（Trend / Evidence）の workflow と Activity。Episode の工程は待たない（INV-37）。
    # RESEARCH_PROVIDER: none（既定。依頼は外部を呼ばずに blocked）| fake（固定コーパス）。実 Provider は未配線。
    # YOUTUBE_* / CODEX_* / FAL_KEY は持たせない
    <<: *worker
    depends_on: *deps-minio
    environment:
      AVP_SERVICE_NAME: research-worker
      <<: *app-env
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-none}
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.research.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "research"]

  prometheus:
    logging: *logging
    image: prom/prometheus:latest
    profiles: [observability]
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    logging: *logging
    image: grafana/grafana:latest
    profiles: [observability]
    depends_on: [prometheus]
    ports: ["3001:3000"]
    volumes: [grafanadata:/var/lib/grafana]

volumes:
  pgdata:
  grafanadata:
