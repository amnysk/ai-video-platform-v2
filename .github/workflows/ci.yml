name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Create venv (pyright resolves imports from .venv)
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/pyright

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/contract -q

  architecture:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/architecture -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - name: Prepare MinIO data directory
        run: sudo mkdir -p /mnt/minio-hdd/minio-data && sudo chmod 777 /mnt/minio-hdd/minio-data
      - name: Start core services
        run: docker compose --profile core up -d --wait
      - run: pytest tests/integration -q -m integration
        env:
          DATABASE_URL: postgresql+asyncpg://avp:change-me@localhost:5432/avp
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: change-me
          MINIO_BUCKET: artifacts
          # 有料provider・実投稿へは絶対に到達させない (INV-18)
          FAL_KEY: ""
          YOUTUBE_CLIENT_ID: ""
          YOUTUBE_CLIENT_SECRET: ""
      - if: always()
        run: docker compose --profile core logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Smoke test the running stack
        run: ./scripts/smoke.sh
      - if: always()
        run: docker compose --profile core down -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose --profile core --profile observability config -q
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: avp2-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
