name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pyright

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/contract -q

  architecture:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/architecture -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - name: Start core services
        run: docker compose --profile core up -d --wait
      - run: pytest tests/integration -q -m integration
        env:
          # 有料provider・実投稿へは絶対に到達させない (INV-18)
          FAL_KEY: ""
          YOUTUBE_CLIENT_ID: ""
          YOUTUBE_CLIENT_SECRET: ""
      - if: always()
        run: docker compose --profile core logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
      - if: always()
        run: docker compose --profile core down -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose --profile core --profile observability config -q
      # Phase 1 で apps/api と workers の Dockerfile を追加したら、
      # ここで docker/build-push-action@v6 (push:false, cache:gha) を実行する
