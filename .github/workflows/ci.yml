name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Create venv (pyright resolves imports from .venv)
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/pyright

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/contract -q

  architecture:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/architecture -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - name: Prepare MinIO data directory
        run: sudo mkdir -p /mnt/minio-hdd/minio-data && sudo chmod 777 /mnt/minio-hdd/minio-data
      - name: Start core services
        run: docker compose --profile core up -d --wait
      - name: Assert the migration container succeeded
        # --wait の依存条件に頼らず、ワンショットの migrate が 0 で終わったことを直接見る
        run: |
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")
          docker compose logs --no-color migrate
          test "$code" = "0" || { echo "migrate exited with $code"; exit 1; }
      - run: pytest tests/integration -q -m integration
        env:
          DATABASE_URL: postgresql+psycopg://avp:change-me@localhost:5432/avp
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: change-me
          MINIO_BUCKET: artifacts
          # 有料provider・実投稿へは絶対に到達させない (INV-18)
          FAL_KEY: ""
          YOUTUBE_CLIENT_ID: ""
          YOUTUBE_CLIENT_SECRET: ""
          # 本物のCodexへ到達させない（tests/live は collect_ignore と -m 'not live'
          # でも除外されるが、環境側でも塞ぐ）
          AVP_LIVE_CODEX: ""
          CODEX_BINARY: /nonexistent/codex
      - if: always()
        run: docker compose --profile core logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Smoke test the running stack
        run: ./scripts/smoke.sh
      - if: always()
        run: docker compose --profile core down -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose --profile core --profile observability config -q
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: avp2-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime imports resolve inside the image
        # 「ビルドは通るが import で落ちる」（psycopg2 未導入で migrate が落ちた形）を
        # 重い integration ジョブを待たずに検出する
        run: |
          docker run --rm avp2-app:ci python -c "
          import alembic, fastapi, minio, psycopg, pydantic, sqlalchemy, temporalio
          import apps.api.main, workers.dummy.workflows, infrastructure.db.models
          import workers.planning.workflows, workers.storyboard.workflows, contracts.artifacts
          print('runtime imports OK')
          "
      - name: Alembic is usable inside the image
        run: docker run --rm avp2-app:ci alembic --help
