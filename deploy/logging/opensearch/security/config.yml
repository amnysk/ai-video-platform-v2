# security plugin の認証設定（ADR-0040 §6）。イメージ同梱の既定を置き換える。
_meta:
  type: "config"
  config_version: 2
config:
  dynamic:
    http:
      anonymous_auth_enabled: false
    # Dashboards のサーバーユーザーを kibanaserver 以外の名前にするには必須（未設定だと 403 で起動しない。実測）
    kibana:
      multitenancy_enabled: false
      server_username: avp_dashboards
      index: ".kibana"
    authc:
      basic_internal_auth_domain:
        description: "HTTP Basic against the internal users database"
        http_enabled: true
        transport_enabled: true
        order: 0
        http_authenticator:
          type: basic
          challenge: true
        authentication_backend:
          type: intern
    authz: {}
