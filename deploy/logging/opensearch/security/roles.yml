# 最小権限のロール（ADR-0040 §6）。実測: writer は bulk create 可、検索・削除・index 作成・.kibana は 403。
_meta:
  type: "roles"
  config_version: 2

# Fluent Bit: 対象 index への bulk/index だけ（index 作成・検索・削除を持たない）
avp_log_writer:
  reserved: true
  cluster_permissions:
    - "indices:data/write/bulk"
  index_permissions:
    - index_patterns: ["avp-app-*", "avp-infra-*"]
      allowed_actions:
        - "indices:data/write/index"
        - "indices:data/write/bulk*"

# 閲覧者（Dashboards・確認スクリプト）: 読み取りと、index のサイズ・状態の参照だけ
avp_log_viewer:
  reserved: true
  cluster_permissions:
    - "cluster_composite_ops_ro"
    - "cluster_monitor"
  index_permissions:
    - index_patterns: ["avp-app-*", "avp-infra-*"]
      allowed_actions:
        - "read"
        - "indices_monitor"
        - "indices:admin/mappings/get"
        - "indices:admin/resolve/index"
