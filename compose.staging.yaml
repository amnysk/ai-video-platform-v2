# staging（ADR-0049 / docs/operations/staging.md）。本番（compose.yaml）とは別の compose project。
#
#   docker compose -f compose.staging.yaml up -d      ← 所有者の承認後にだけ。このファイルを書いた人は起動しない
#
# 本番と共有しないもの（tests/contract/test_compose_staging.py が機械的に検査する）:
#   project 名 / named volume（host path の bind mount は1つも持たない。本番の MinIO 実データ置き場は不可） /
#   host port（127.0.0.1 のみ） / Temporal namespace / DB / MinIO bucket と認証 / イメージタグ
# 有料・外部副作用:
#   FAL_KEY・YOUTUBE_* は空、Upload は止める。FAL / YouTube を呼ぶ worker（画像・動画・音声・投稿・
#   script・storyboard）は定義しない。変数展開は本番の .env を読むので使わない（全て literal）。
# 秘密ではない: ここの認証値は staging 専用の使い捨て（127.0.0.1 のみ公開）。本番の値は書かない。
name: avp2-staging

x-core-env: &core-env
  DATABASE_URL: postgresql+psycopg://avp_staging:staging-only@postgres:5432/avp_staging
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: avp-staging
  AVP_ENVIRONMENT: staging
  AVP_LOG_FORMAT: json
  PAUSED: "true"
  UPLOADS_PAUSED: "true"

x-app-env: &app-env
  <<: *core-env
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: staging-minio
  MINIO_SECRET_KEY: staging-only-secret
  MINIO_BUCKET: artifacts-staging
  TEMPORAL_TASK_QUEUE: episode-skeleton
  # 有料 provider・YouTube は空（呼べない）
  FAL_KEY: ""
  YOUTUBE_CLIENT_ID: ""
  YOUTUBE_CLIENT_SECRET: ""
  YOUTUBE_CHANNEL_ID: ""
  YOUTUBE_ANALYTICS_ENABLED: "false"
  RESEARCH_PROVIDER: none

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-worker: &worker
  build: {context: ., target: worker}
  image: avp2-staging-worker:local
  user: "1000:1000"
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-worker-health: &worker-health
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 60s

x-deps: &deps
  postgres: {condition: service_healthy}
  migrate: {condition: service_completed_successfully}
  temporal: {condition: service_healthy}
  minio: {condition: service_healthy}

services:
  postgres:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: avp_staging
      POSTGRES_PASSWORD: staging-only
      POSTGRES_DB: avp_staging
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avp_staging"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    logging: *logging
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: staging-minio
      MINIO_ROOT_PASSWORD: staging-only-secret
      MINIO_BUCKET: artifacts-staging
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes:
      - staging_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    logging: *logging
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: avp_staging
      POSTGRES_PWD: staging-only
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: avp-staging
    ports: ["127.0.0.1:17233:7233"]
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -qx SERVING"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-ui:
    logging: *logging
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: avp-staging
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:18233
    ports: ["127.0.0.1:18233:8080"]

  migrate:
    logging: *logging
    build: {context: ., target: app}
    image: avp2-staging-app:local
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AVP_SERVICE_NAME: migrate
      <<: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    logging: *logging
    build: {context: ., target: app}
    image: avp2-staging-app:local
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_started}
      minio: {condition: service_started}
    environment:
      AVP_SERVICE_NAME: api
      <<: *app-env
    ports: ["127.0.0.1:18000:8000"]
    restart: unless-stopped
    command: ["python", "-m", "apps.api.serve"]

  dummy-worker:
    logging: *logging
    build: {context: ., target: app}
    image: avp2-staging-app:local
    init: true
    restart: unless-stopped
    depends_on: *deps
    environment:
      AVP_SERVICE_NAME: dummy-worker
      <<: *app-env
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.dummy.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "episode-skeleton"]

  pipeline-worker:
    <<: *worker
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
    environment:
      AVP_SERVICE_NAME: pipeline-worker
      <<: *core-env
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.pipeline.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "pipeline"]

  production-worker:
    # 状態系 Activity だけ（有料の画像・動画・音声 worker は定義しない）
    <<: *worker
    depends_on: *deps
    environment:
      AVP_SERVICE_NAME: production-worker
      <<: *app-env
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.production.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "production"]

  research-worker:
    <<: *worker
    depends_on: *deps
    environment:
      AVP_SERVICE_NAME: research-worker
      <<: *app-env
    command: ["python", "-m", "infrastructure.runtime.worker_entry", "workers.research.run_worker"]
    healthcheck:
      <<: *worker-health
      test: ["CMD", "python", "-m", "infrastructure.temporal.poller_check", "--queue", "research"]

volumes:
  staging_pgdata:
  staging_minio:
