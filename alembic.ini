[alembic]
script_location = infrastructure/db/migrations
path_separator = os
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url は infrastructure/db/migrations/env.py が Settings から解決する。
# ここに実際の接続情報（secret）を書かないこと（INV-20）。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
